<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos Challenge 50 | Unidad 1</title><style>
:root{--navy:#08172c;--panel:#122744;--cyan:#59e6e3;--gold:#f4cf70;--white:#f4f7fe;--mute:#bad0e3;--ok:#69e1b2;--bad:#ff909c;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 2%,#1a4068,transparent 49%),linear-gradient(120deg,#08172c,#0a1930 65%,#0f2b42);min-height:100vh;color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1040px;margin:0 auto;padding:27px 19px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{letter-spacing:.15em;font-weight:900;color:var(--gold)}.panel{background:linear-gradient(125deg,#172e4edc,#10223ddc);border:1px solid #426083;border-radius:25px;padding:clamp(22px,5vw,44px);box-shadow:0 15px 55px #010b1960}h1{font-size:clamp(2.1rem,6vw,4.1rem);line-height:1.06;letter-spacing:-.035em;margin:12px 0 22px}h2{font-size:clamp(1.4rem,3.3vw,2rem);line-height:1.35}p{line-height:1.62}.muted{color:var(--mute)}.tag{display:inline-block;background:#244461;color:var(--cyan);font-weight:800;border:1px solid #4e7296;border-radius:50px;padding:7px 14px;font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:17px 0}.tile{background:#0d223c;border:1px solid #38577b;border-radius:15px;padding:17px}.tile strong{color:var(--cyan)}label{font-weight:800;display:block;margin-top:18px}input[type=text]{width:100%;background:#091b33;color:white;border:1px solid #7592b3;border-radius:13px;padding:16px;font:inherit;font-size:1.15rem;margin-top:10px}button{font:inherit;cursor:pointer;transition:.14s transform,.14s border-color}button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--cyan)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary,.secondary{padding:14px 19px;font-weight:850;border-radius:13px}.primary{border:0;background:linear-gradient(115deg,var(--gold),#ffeead);color:#132742}.secondary{border:1px solid #7896b5;background:#203854;color:var(--white)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:19px}.choice{cursor:pointer;border-radius:15px;padding:20px;background:#0b203a;border:1px solid #526d8a;flex:1;min-width:210px}.choice:has(input:checked){border:2px solid var(--cyan);background:#153a4d}.choice input{accent-color:var(--cyan)}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#0c213c;padding:8px 14px;border:1px solid #45607a;border-radius:10px}.progress{height:12px;background:#0b2034;border-radius:30px;overflow:hidden;margin:20px 0}.progress>div{background:linear-gradient(90deg,var(--cyan),var(--gold));height:100%;transition:width .2s}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.answer{display:flex;text-align:left;gap:15px;align-items:center;padding:17px 15px;background:#102a49;border:1px solid #567297;border-radius:15px;color:white;min-height:74px}.answer:disabled{cursor:default}.answer.ok{border:2px solid var(--ok);background:#123b3b}.answer.bad{border:2px solid var(--bad);background:#4b2435}.letter{display:grid;place-items:center;flex:0 0 31px;height:31px;border-radius:9px;background:#2f5570;color:var(--gold);font-weight:900}.feedback{border-left:5px solid var(--cyan);background:#102c43;border-radius:12px;padding:18px 20px;margin:14px 0;line-height:1.7;white-space:pre-line}.big{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;color:var(--gold)}.review{padding:15px;border-bottom:1px solid #47607b;line-height:1.5}.review p{margin:8px 0}.level{font-weight:800;color:var(--gold)}.small{font-size:.87rem}.foot{margin-top:24px;color:var(--mute);font-size:.85rem}.split{display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px}.scoregood{color:var(--ok)}.scorebad{color:var(--bad)}@media(max-width:640px){.answers,.grid{grid-template-columns:1fr}.panel{padding:22px}.brand{letter-spacing:.04em}main{padding:15px 12px 50px}}@media print{body{background:white;color:black}header,#sound,.noprint,button{display:none!important}main{max-width:none;padding:0}.panel{box-shadow:none;border:0;background:white;color:black;padding:10px}h1,h2,p{color:black!important}.tile,.stat,.review{border:1px solid #aaa;background:white;color:black!important}.big{color:black}}
</style></head><body><main><header><div class="brand">◆ EVENTOS CHALLENGE 50</div><button class="secondary" id="sound" aria-label="Activar o desactivar sonido">🔇 Sonido</button></header><div id="app"></div></main><script>
const QUESTIONS=[{"section": "1.1", "type": "test", "q": "¿Qué combinación recoge los elementos esenciales de un evento?", "options": ["Personas, objetivo, espacio, servicios y experiencia", "Localización, publicidad y precio exclusivamente", "Alojamiento, transporte y excursiones obligatorios", "Salón, restauración y pernoctación siempre"], "answer": 0, "why": "Un evento reúne personas con un objetivo en un lugar y momento determinados y necesita coordinación de espacios, servicios y experiencia. No exige siempre alojamiento ni restauración."}, {"section": "1.1", "type": "test", "q": "¿Cuál de estos ejemplos corresponde al mercado MICE?", "options": ["Una cena familiar de aniversario", "Una fiesta privada de cumpleaños", "Un congreso profesional de especialistas", "Una comunión con 40 invitados"], "answer": 2, "why": "MICE agrupa reuniones, incentivos, congresos/conferencias y exposiciones de carácter profesional."}, {"section": "1.1", "type": "test", "q": "¿Qué significa la I de MICE?", "options": ["Information", "Incentives", "International", "Innovation"], "answer": 1, "why": "La I corresponde a Incentives: viajes y actividades de incentivo empresarial."}, {"section": "1.1", "type": "test", "q": "Una empresa organiza una convención con pernoctación. ¿Qué conjunto de servicios puede solicitar al hotel?", "options": ["Salón, habitaciones, restauración y equipos audiovisuales", "Únicamente habitaciones sin otros servicios", "Solo transporte fuera del establecimiento", "Exclusivamente alquiler de equipos de cocina"], "answer": 0, "why": "La oferta hotelera para eventos puede integrar instalaciones, alojamiento, restauración y soporte tecnológico, según el perfil y necesidades de la empresa."}, {"section": "1.1", "type": "vf", "q": "Todo evento organizado en un hotel exige necesariamente un servicio de restauración.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "Existen reuniones, entrevistas, cursos o conferencias que únicamente requieren el alquiler del salón y sus medios técnicos."}, {"section": "1.2", "type": "test", "q": "¿Quién representa principalmente la demanda en el mercado de eventos?", "options": ["Empresas, instituciones y asociaciones que necesitan eventos", "Únicamente los hoteles con salas", "Solo proveedores de sonido", "Los recintos sin clientes"], "answer": 0, "why": "La demanda la forman quienes necesitan contratar u organizar eventos; la oferta aporta recintos y servicios."}, {"section": "1.2", "type": "test", "q": "¿Qué función caracteriza a un OPC?", "options": ["Alquilar vehículos exclusivamente", "Diseñar rutas de ocio del destino únicamente", "Organizar profesionalmente congresos y reuniones", "Vender habitaciones individuales de vacaciones"], "answer": 2, "why": "Un OPC gestiona la organización de reuniones y congresos, coordinando programa, inscripciones y proveedores."}, {"section": "1.2", "type": "test", "q": "¿Qué caracteriza a una DMC?", "options": ["Inspeccionar legislación alimentaria", "Coordinar servicios y experiencias en el destino", "Aprobar subvenciones del evento", "Determinar impuestos municipales"], "answer": 1, "why": "Una DMC es una empresa especializada en servicios receptivos y experiencias vinculadas al destino."}, {"section": "1.2", "type": "vf", "q": "En la venta de eventos, quien contrata y quien asiste son siempre la misma persona.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "La empresa o institución puede tomar la decisión de contratación, mientras que las personas asistentes son usuarias finales distintas."}, {"section": "1.2", "type": "caso", "q": "Una asociación médica prepara un congreso y necesita gestionar ponentes e inscripciones. ¿Qué intermediario encaja mejor?", "options": ["OPC", "DMC dedicada a excursiones", "Agencia centrada en vacaciones individuales", "Proveedor exclusivo de transporte"], "answer": 0, "why": "El OPC se especializa en coordinar congresos: programa, asistentes, ponentes y proveedores. Una DMC puede complementar con servicios de destino."}, {"section": "1.3–1.4", "type": "test", "q": "¿Qué opción contiene solo componentes habituales de la oferta de eventos de un hotel?", "options": ["Solo souvenirs y actividades externas", "Salones, alojamiento, restauración y tecnología", "Solo habitaciones y aparcamiento", "Únicamente una tarifa por persona"], "answer": 1, "why": "Un hotel puede integrar espacios, habitaciones, comida, audiovisuales, personal y experiencias."}, {"section": "1.3–1.4", "type": "test", "q": "¿Qué servicio del hotel facilita especialmente una presentación híbrida?", "options": ["Servicio de lavandería de huéspedes", "Minibar de las habitaciones", "Conectividad, audiovisuales y streaming", "Ampliación de la carta de almohadas"], "answer": 2, "why": "La tecnología audiovisual y de streaming permite integrar a participantes presenciales y remotos."}, {"section": "1.3–1.4", "type": "caso", "q": "Un congreso reserva varias habitaciones y la empresa quiere ofrecer un servicio adicional a los participantes. ¿Qué acción constituye venta cruzada adecuada?", "options": ["Ofrecer habitaciones y cena a quienes contratan el salón", "Reducir la capacidad de la sala sin avisar", "Cobrar dos veces por el mismo equipamiento", "Eliminar el servicio de recepción"], "answer": 0, "why": "La venta cruzada consiste en proponer servicios complementarios a la contratación principal, adecuados a las necesidades."}, {"section": "1.3–1.4", "type": "test", "q": "¿Qué debe comprobarse al elegir una sala para una conferencia?", "options": ["Solo su nombre comercial", "Solo si tiene vistas al mar", "Capacidad, montaje y equipamiento", "Solo su proximidad al restaurante"], "answer": 2, "why": "La capacidad, la distribución de asistentes y los medios técnicos determinan si la sala sirve para el evento."}, {"section": "1.3–1.4", "type": "vf", "q": "La seguridad en un evento puede comprender personas, instalaciones y datos.", "options": ["Verdadero", "Falso"], "answer": 0, "why": "La planificación de servicios incluye medidas de seguridad de los participantes, del espacio y de la información utilizada."}, {"section": "1.3–1.4", "type": "caso", "q": "Un hotel recibe a 80 participantes en un curso que necesitan ver presentaciones y escuchar al ponente. ¿Qué paquete es más coherente?", "options": ["Solo habitación y desayuno", "Excursión y cena de gala sin sala", "Sala adecuada, proyector, sonido y apoyo técnico", "Fotografía familiar y pista de baile"], "answer": 2, "why": "La propuesta debe ajustarse a un curso: espacio, visibilidad, sonido y personal de apoyo técnico."}, {"section": "1.5", "type": "test", "q": "¿Qué criterio corresponde a una segmentación geográfica?", "options": ["Edad del participante", "Motivación de asistencia", "Procedencia y desplazamiento de asistentes", "Presupuesto para restauración"], "answer": 2, "why": "La variable geográfica distingue procedencia y necesidades de movilidad."}, {"section": "1.5", "type": "test", "q": "¿Qué información adicional resulta esencial al presupuestar un evento?", "options": ["Número de asistentes, duración, presupuesto y decisor", "Solo el diseño del logotipo", "Solo el número de seguidores en redes", "Solo la antigüedad del hotel"], "answer": 0, "why": "Estas variables permiten dimensionar el servicio y ajustar la propuesta a quien toma la decisión."}, {"section": "1.5", "type": "vf", "q": "Dos clientes que reúnen 15 directivos y 100 familiares requieren necesariamente la misma distribución de sala.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "El tamaño, propósito y perfil del evento modifican montaje, horarios, restauración y comunicación."}, {"section": "1.5", "type": "caso", "q": "Un equipo comercial atiende a 15 directivos en una reunión confidencial. ¿Qué propuesta priorizarías?", "options": ["Un cóctel para 150 personas y música en directo", "Sala privada con montaje apropiado y tecnología fiable", "Un salón sin conexión ni control de accesos", "Un programa infantil durante toda la sesión"], "answer": 1, "why": "Para un grupo directivo conviene priorizar privacidad, funcionalidad, soporte técnico y servicios proporcionados."}, {"section": "1.6", "type": "test", "q": "¿Qué diferencia describe correctamente coste y precio?", "options": ["Son siempre idénticos", "El coste es lo que paga el cliente", "El coste refleja recursos empleados y el precio es la oferta al cliente", "El precio solo puede calcularse después del evento"], "answer": 2, "why": "El coste corresponde al consumo de recursos; el precio es el importe ofrecido o cobrado al cliente."}, {"section": "1.6", "type": "test", "q": "¿Cuál puede ser una fuente de financiación de un congreso?", "options": ["Solo alquiler de habitaciones", "Solo beneficios del restaurante", "Solo pago a proveedores", "Inscripciones, patrocinadores, expositores o subvenciones"], "answer": 3, "why": "El tema incluye cuotas de inscripción, aportaciones de patrocinadores, stands y posibles subvenciones."}, {"section": "1.6", "type": "vf", "q": "La aportación de un patrocinador puede ofrecerse a cambio de visibilidad durante un evento.", "options": ["Verdadero", "Falso"], "answer": 0, "why": "El patrocinio puede financiar parte de la actividad a cambio de presencia o difusión de la marca."}, {"section": "1.6", "type": "vf", "q": "La diferencia entre precio y costes directos equivale siempre al beneficio neto definitivo.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "Todavía pueden existir otros gastos, impuestos y obligaciones que afecten al resultado final."}, {"section": "1.6", "type": "calculo", "q": "Caso hipotético: salón 300 €, coffee break 600 €, técnica 200 € y personal 150 €. ¿Cuál es el coste total?", "options": ["1.150 €", "1.250 €", "1.350 €", "1.600 €"], "answer": 1, "why": "DATOS: salón 300 €, coffee break 600 €, medios técnicos 200 € y personal 150 €. FÓRMULA: coste total = suma de las partidas. SUSTITUCIÓN: 300 + 600 + 200 + 150. OPERACIÓN: 900 + 200 + 150 = 1.250. RESULTADO: 1.250 €. INTERPRETACIÓN: es el coste presupuestado de las partidas incluidas; no es necesariamente el coste total definitivo."}, {"section": "1.6", "type": "caso", "q": "Un hotel ha calculado 1.250 € de costes directos para una jornada y presenta un precio de venta de 1.600 €. ¿Qué conclusión comercial está justificada?", "options": ["Existe una diferencia de 350 € antes de otros gastos e impuestos", "El beneficio neto definitivo ya es 350 €", "Los costes totales de la empresa son 350 €", "El precio debe reducirse automáticamente a 1.250 €"], "answer": 0, "why": "DATOS: costes directos 1.250 € y precio 1.600 €. CÁLCULO: 1.600 − 1.250 = 350 €. RESULTADO: diferencia de 350 €. INTERPRETACIÓN: orienta sobre el margen antes de gastos adicionales e impuestos; no equivale necesariamente al beneficio neto."}, {"section": "1.7", "type": "test", "q": "¿Qué tarea corresponde sobre todo a la fase anterior al evento?", "options": ["Analizar satisfacción tras la clausura", "Entregar certificados al finalizar", "Difundir el programa y captar inscritos", "Recopilar valoraciones finales"], "answer": 2, "why": "Antes del evento se informa, promociona y capta al público objetivo."}, {"section": "1.7", "type": "test", "q": "¿Cuál es el orden adecuado de las fases de venta comercial del tema?", "options": ["Preparar, escuchar, argumentar, responder, cerrar y analizar", "Cerrar, argumentar, preparar, analizar, responder y escuchar", "Preparar, cerrar, escuchar, analizar, argumentar y responder", "Escuchar, cerrar, preparar, responder, argumentar y analizar"], "answer": 0, "why": "La venta comienza con preparación y escucha; continúa con propuesta y objeciones y termina con cierre y análisis."}, {"section": "1.7", "type": "test", "q": "¿Para qué sirve un dossier comercial de eventos?", "options": ["Sustituir los contratos legales", "Eliminar la visita al establecimiento", "Determinar automáticamente el ROI", "Mostrar espacios, capacidades, servicios y posibilidades de contratación"], "answer": 3, "why": "El dossier ayuda a los clientes a valorar salones, aforos, recursos y servicios disponibles."}, {"section": "1.7", "type": "vf", "q": "La comunicación con el cliente termina cuando finaliza físicamente el evento.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "Después del evento conviene agradecer, evaluar la satisfacción y mantener la relación comercial."}, {"section": "1.7", "type": "caso", "q": "El cliente dice: «Su presupuesto es demasiado caro». ¿Cuál es la respuesta comercial más adecuada?", "options": ["Rebajar automáticamente todos los precios", "Ignorar la objeción y exigir el anticipo", "Aclarar las partidas, justificar el valor y estudiar alternativas", "Cancelar la reunión sin analizar sus necesidades"], "answer": 2, "why": "La gestión de objeciones requiere escuchar, explicar el valor de la propuesta y explorar ajustes viables."}, {"section": "1.8", "type": "calculo", "q": "En una encuesta a 100 asistentes hay 60 promotores (9–10), 25 pasivos (7–8) y 15 detractores (0–6). ¿Cuál es el NPS del evento?", "options": ["45 %", "+45 puntos", "+60 puntos", "+25 puntos"], "answer": 1, "why": "DATOS: 100 respuestas, 60 promotores, 25 pasivos y 15 detractores. FÓRMULA: NPS = porcentaje de promotores − porcentaje de detractores. SUSTITUCIÓN: 60/100 × 100 − 15/100 × 100. OPERACIÓN: 60 % − 15 % = 45 puntos. RESULTADO: +45 puntos. INTERPRETACIÓN: hay 45 puntos porcentuales más de promotores que de detractores; es favorable a la recomendación. No expresar el resultado final como 45 %."}, {"section": "1.8", "type": "vf", "q": "Un evento puede evaluarse tanto por su resultado económico como por la satisfacción o los contactos generados.", "options": ["Verdadero", "Falso"], "answer": 0, "why": "Los indicadores dependen de los objetivos: rentabilidad, asistencia, notoriedad y relaciones comerciales."}, {"section": "1.8", "type": "calculo", "q": "Un congreso tiene 150 inscritos y 120 asistentes reales. ¿Qué porcentaje de inscritos asistió?", "options": ["75 %", "80 %", "85 %", "90 %"], "answer": 1, "why": "DATOS: 120 asistentes reales y 150 inscritos. FÓRMULA: tasa de asistencia = (asistentes reales / inscritos) × 100. SUSTITUCIÓN: (120 / 150) × 100. OPERACIÓN: 0,8 × 100 = 80. RESULTADO: 80 %. INTERPRETACIÓN: asistieron 80 de cada 100 inscritos."}, {"section": "1.8", "type": "calculo", "q": "Ejemplo hipotético: un salón de 150 m² genera 3.000 € de ingresos en el periodo. ¿Qué RevPAS por m² resulta?", "options": ["15 €/m²", "18 €/m²", "20 €/m²", "25 €/m²"], "answer": 2, "why": "DATOS: ingresos del salón 3.000 € y superficie 150 m². FÓRMULA: RevPAS = ingresos del espacio / superficie disponible. SUSTITUCIÓN: 3.000 € / 150 m². OPERACIÓN: 3.000 / 150 = 20. RESULTADO: 20 €/m² durante el periodo analizado. INTERPRETACIÓN: se han generado 20 € por metro cuadrado disponible en ese periodo."}, {"section": "1.8", "type": "calculo", "q": "Una acción cuesta 5.000 € y genera un beneficio neto atribuible de 1.000 €. ¿Qué ROI simplificado obtiene?", "options": ["10 %", "20 %", "25 %", "50 %"], "answer": 1, "why": "DATOS: beneficio neto atribuible 1.000 € e inversión 5.000 €. FÓRMULA: ROI = (beneficio neto atribuible / inversión) × 100. SUSTITUCIÓN: (1.000 / 5.000) × 100. OPERACIÓN: 0,2 × 100 = 20. RESULTADO: 20 %. INTERPRETACIÓN: por cada 100 € invertidos se obtuvieron 20 € de beneficio neto atribuible, según el supuesto."}, {"section": "1.8", "type": "test", "q": "En la gestión de eventos, ¿cuál de estas afirmaciones distingue correctamente un KPI de un objetivo?", "options": ["Un KPI mide el avance o resultado respecto a un objetivo", "Un KPI sustituye la planificación de objetivos", "Un objetivo solo puede expresarse en euros", "Un KPI es siempre la cifra total de ingresos"], "answer": 0, "why": "KPI (Key Performance Indicator) significa indicador clave de rendimiento. Un indicador permite medir resultados y evaluar si se cumplen objetivos; puede ser económico, de asistencia o satisfacción."}, {"section": "1.8", "type": "test", "q": "Si dos salones tienen superficies diferentes, ¿qué dato necesitas para comparar su RevPAS de un mismo periodo?", "options": ["Ingresos del espacio y metros cuadrados disponibles", "Solo número de asistentes", "Solo precio del coffee break", "Número de empleados del departamento"], "answer": 0, "why": "RevPAS (Revenue per Available Square Meter) relaciona ingresos atribuibles al espacio con superficie disponible. Deben usarse datos del mismo periodo para comparar correctamente."}, {"section": "1.8", "type": "caso", "q": "Una jornada registra alta asistencia pero comentarios de insatisfacción. ¿Qué combinación permite evaluar ambas dimensiones?", "options": ["Tasa de asistencia y un indicador de satisfacción", "Solo precio de alquiler de sala", "Solo número de invitaciones enviadas", "Solo ingresos sin considerar asistentes"], "answer": 0, "why": "La tasa de asistencia evalúa la participación respecto a inscripciones. Las encuestas o NPS proporcionan información sobre satisfacción y disposición a recomendar; ninguna cifra aislada refleja todo el evento."}, {"section": "1.8", "type": "caso", "q": "Una empresa quiere repetir un congreso, pero considera que su inversión no produjo resultados económicos. ¿Qué indicador debería calcular primero?", "options": ["ROI del evento, con inversión y beneficio atribuible", "Capacidad máxima de aparcamiento", "Número de carteles utilizados", "Cantidad de mesas de banquete"], "answer": 0, "why": "ROI (Return on Investment) significa retorno de la inversión. Compara beneficio neto atribuible con inversión: (beneficio/inversión) × 100. Conviene analizarlo junto a otros KPI no económicos."}, {"section": "1.8", "type": "vf", "q": "Un NPS de +45 significa que el 45 % de todos los asistentes fueron promotores.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "NPS = % de promotores − % de detractores y se expresa en puntos. Por ejemplo, 60 % de promotores y 15 % de detractores dan +45 puntos, no un porcentaje de promotores del 45 %."}, {"section": "1.9", "type": "test", "q": "¿Qué información es apropiada para registrar en un CRM de eventos?", "options": ["Datos irrelevantes de toda la familia", "Contraseñas privadas del cliente", "Contactos profesionales, propuestas y seguimiento comercial", "Datos indiscriminados sin finalidad"], "answer": 2, "why": "El CRM ayuda a registrar contactos, presupuestos, incidencias y oportunidades relevantes, respetando la protección de datos."}, {"section": "1.9", "type": "vf", "q": "Disponer de los correos de los asistentes a un congreso permite enviarles cualquier publicidad sin más requisitos.", "options": ["Verdadero", "Falso"], "answer": 1, "why": "Para comunicaciones comerciales es necesario verificar la base jurídica aplicable y cumplir el deber de información; la inscripción no implica autorización automática."}, {"section": "1.9", "type": "caso", "q": "Un hotel organizó tres reuniones para una empresa y esta solicita otra. ¿Qué uso del CRM aporta más valor?", "options": ["Borrar todos los datos comerciales de inmediato sin comprobar obligaciones", "Consultar servicios contratados y preferencias relevantes para preparar una propuesta", "Enviar la información de asistentes a terceros sin evaluación", "Repetir la propuesta anterior sin preguntar nuevas necesidades"], "answer": 1, "why": "El CRM facilita personalización y continuidad, pero debe contrastarse la necesidad actual y respetar las finalidades de tratamiento."}, {"section": "1.9", "type": "test", "q": "¿Qué significan las siglas B2B cuando un hotel vende servicios para congresos?", "options": ["Business to Business: comercialización de empresa a empresa", "Booking to Booking: reservas entre habitaciones", "Business to Banquet: catering exclusivamente", "Budget to Budget: presupuesto cerrado"], "answer": 0, "why": "B2B (Business to Business) significa negocio entre empresas: por ejemplo, un hotel vende salas, alojamiento y restauración a una compañía que organiza su convención."}, {"section": "1.9", "type": "caso", "q": "Una empresa solicita a un hotel una nueva jornada. El CRM almacena su montaje anterior y preferencias, pero también emails personales. ¿Qué actuación es correcta?", "options": ["Usar los datos necesarios para la nueva propuesta y respetar la finalidad y base jurídica", "Enviar promociones a todos los correos sin comprobar la base jurídica", "Publicar la lista de participantes en redes sociales", "Compartir todas las preferencias con cualquier proveedor sin necesidad"], "answer": 0, "why": "CRM (Customer Relationship Management) ayuda a personalizar propuestas y seguimiento. RGPD (Reglamento General de Protección de Datos) exige finalidad y base jurídica del tratamiento; no autoriza el uso indiscriminado de datos."}, {"section": "1.10–1.11", "type": "test", "q": "¿Qué es un roadshow?", "options": ["Un congreso celebrado siempre por streaming", "Una reunión exclusiva de directivos", "Una ceremonia de reconocimiento familiar", "Un evento o presentación que se realiza de forma itinerante"], "answer": 3, "why": "El roadshow lleva un evento o presentación a distintos lugares para alcanzar públicos diferentes."}, {"section": "1.10–1.11", "type": "test", "q": "¿Qué define mejor un family day de empresa?", "options": ["Una jornada que incorpora a las familias de empleados", "Una exposición exclusivamente comercial", "Un encuentro de proveedores internacionales", "Una reunión cerrada del comité directivo"], "answer": 0, "why": "El family day integra actividades para empleados y sus familias como parte de la experiencia empresarial."}, {"section": "1.10–1.11", "type": "test", "q": "¿Qué acción se alinea con la sostenibilidad en eventos?", "options": ["Imprimir material redundante para cada asistente", "Elegir recursos desechables sin estudiar alternativas", "Priorizar soportes digitales y reducir residuos", "Aumentar traslados innecesarios"], "answer": 2, "why": "Las medidas de reducción de residuos y uso responsable de recursos contribuyen a una organización más sostenible."}, {"section": "1.10–1.11", "type": "test", "q": "¿Qué criterio es prioritario al colaborar con un creador de contenido para promocionar un evento?", "options": ["Elegir a quien tenga más seguidores sin valorar audiencia", "Comprobar afinidad con el público y definir indicadores de resultados", "No medir el efecto de sus publicaciones", "Publicar mensajes sin identificar el objetivo"], "answer": 1, "why": "La comunicación con influencers debe ser pertinente para la audiencia objetivo y evaluable mediante indicadores definidos."}];
const NAMES=['Aprendiz de eventos','Asistente comercial','Ejecutivo de ventas','Responsable comercial','Director de eventos'];
const SECTIONS={'1.1':'Tipología de eventos','1.2':'Mercado e intermediarios','1.3–1.4':'Oferta y servicios','1.5':'Segmentación','1.6':'Tarifas y presupuesto','1.7':'Comunicación y venta','1.8':'Indicadores y cálculos','1.9':'CRM y protección de datos','1.10–1.11':'Innovación y sostenibilidad'};
const KEY='eventosChallenge50_v2'; const el=document.getElementById('app');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=read()||{name:'',mode:'training',index:0,answers:[],sound:false,subset:null,screen:'welcome'};
if(!Array.isArray(state.answers)||state.answers.length>50||!['training','exam'].includes(state.mode))state={name:'',mode:'training',index:0,answers:[],sound:false,subset:null,screen:'welcome'};
function indices(){return Array.isArray(state.subset)?state.subset:QUESTIONS.map((_,i)=>i)}
function complete(){return state.answers.length===indices().length}
function right(){return state.answers.reduce((n,a,i)=>n+(a===QUESTIONS[indices()[i]].answer),0)}
function level(i){return Math.min(4,Math.floor(i/10))}
function sound(success){if(!state.sound)return;try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),v=ctx.createGain();osc.type='sine';osc.frequency.value=success?700:250;v.gain.value=.04;osc.connect(v);v.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.11);osc.onended=()=>ctx.close()}catch(e){}}
function header(){document.querySelector('#sound').textContent=state.sound?'🔊 Sonido':'🔇 Sonido'}
function welcome(){state.screen='welcome';store();el.innerHTML=`<section class="panel"><span class="tag">UNIDAD 1 · RETO DE REPASO</span><h1>¿Serías capaz de dirigir el departamento comercial de eventos de un hotel?</h1><p class="muted">50 preguntas · 5 niveles · 500 puntos · Sin cronómetro · Ejemplos hipotéticos</p><div class="grid"><div class="tile">🏨 <strong>Casos hoteleros</strong><p>Decisiones reales de gestión comercial.</p></div><div class="tile">🧮 <strong>Reto de fórmulas</strong><p>Presupuesto, RevPAS, ROI, NPS y asistencia.</p></div></div><label for="student">Tu nombre (solo se guarda en este navegador)</label><input id="student" type="text" maxlength="70" autocomplete="name" placeholder="Escribe tu nombre" value="${escapeHTML(state.name)}"/><p><strong>Elige el modo:</strong></p><div class="row"><label class="choice"><input type="radio" name="mode" value="training" ${state.mode==='training'?'checked':''}> 🎯 Entrenamiento<br><span class="muted small">Explicaciones después de responder.</span></label><label class="choice"><input type="radio" name="mode" value="exam" ${state.mode==='exam'?'checked':''}> 📝 Simulacro<br><span class="muted small">Corrección al finalizar.</span></label></div><div class="row"><button class="primary" id="start">Comenzar reto →</button>${state.answers.length&&!complete()?'<button class="secondary" id="resume">Continuar partida anterior</button>':''}</div><p class="foot">Los resultados no se envían automáticamente al campus ni al profesorado.</p></section>`;
document.querySelector('#start').onclick=()=>{let name=document.querySelector('#student').value.trim();if(!name){document.querySelector('#student').focus();return}state={name,mode:document.querySelector('[name=mode]:checked').value,index:0,answers:[],sound:state.sound,subset:null,screen:'question'};store();render()};let resume=document.querySelector('#resume');if(resume)resume.onclick=()=>{state.screen='question';render()}}
function render(){header();if(state.screen==='welcome')return welcome();if(complete())return results();let n=indices().length,i=state.index,qi=indices()[i],q=QUESTIONS[qi];let lvl=level(qi);state.screen='question';store();el.innerHTML=`<section class="panel"><div class="split"><div class="stats"><div class="stat">👤 ${escapeHTML(state.name)}</div><div class="stat">⭐ ${right()*10}/${n*10} puntos</div><div class="stat">Pregunta ${i+1}/${n}</div></div><button class="secondary noprint" id="exit">Inicio</button></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><div style="width:${100*i/n}%"></div></div><p class="level">🏅 Nivel ${lvl+1} · ${NAMES[lvl]}</p><span class="tag">${escapeHTML(q.section)} · ${escapeHTML(SECTIONS[q.section])} · ${q.type==='caso'?'Caso hotelero':q.type==='calculo'?'Cálculo':q.type==='vf'?'Verdadero o falso':'Tipo test'}</span><h2>${escapeHTML(q.q)}</h2><div class="answers">${q.options.map((a,j)=>`<button class="answer" data-a="${j}"><span class="letter">${q.type==='vf'?(j?'F':'V'):String.fromCharCode(65+j)}</span><span>${escapeHTML(a)}</span></button>`).join('')}</div><div id="reply" aria-live="polite"></div></section>`;document.querySelector('#exit').onclick=()=>{state.screen='welcome';welcome()};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>pick(+b.dataset.a));}
function pick(a){let ids=indices(),i=state.index,q=QUESTIONS[ids[i]],ok=a===q.answer;state.answers.push(a);state.index++;store();sound(ok);document.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(state.mode==='training'){let k=+b.dataset.a;if(k===q.answer)b.classList.add('ok');else if(k===a)b.classList.add('bad')}else if(+b.dataset.a===a){b.style.borderColor='#f4cf70'}});
let f=document.querySelector('#reply');f.innerHTML=(state.mode==='training'?`<div class="feedback"><strong>${ok?'✅ ¡Bien! +10 puntos':'💡 Esta vez no sumas puntos'}</strong><p><strong>Respuesta correcta:</strong> ${escapeHTML(q.options[q.answer])}</p><p>${escapeHTML(q.why)}</p></div>`:`<div class="feedback">Respuesta registrada. La solución se mostrará al finalizar el simulacro.</div>`)+`<button class="primary" id="next">${state.index===ids.length?'Ver resultados →':state.index%10===0?'Recibir insignia →':'Siguiente pregunta →'}</button>`;
document.querySelector('#next').onclick=()=>{if(state.index===ids.length)return results();if(state.index%10===0 && !state.subset)return milestone();render()};}
function milestone(){let l=level(indices()[state.index-1]);el.innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:4rem">🏅</div><span class="tag">INSIGNIA CONSEGUIDA</span><h1>${NAMES[l]}</h1><p>Has completado ${state.index} preguntas.</p><button id="continue" class="primary">Continuar →</button></section>`;document.querySelector('#continue').onclick=render}
function stats(){let out={};indices().forEach((idx,i)=>{let s=QUESTIONS[idx].section;out[s]??={n:0,hit:0};out[s].n++;if(state.answers[i]===QUESTIONS[idx].answer)out[s].hit++});return out}
function results(){state.screen='results';store();let n=indices().length,hit=right(),pct=Math.round(hit/n*100),s=stats(),weak=Object.entries(s).filter(([_,v])=>v.hit/v.n<.7);let msg=pct>=90?'Experto en comercialización de eventos':pct>=70?'Muy buen dominio de los contenidos':pct>=50?'Buen progreso; conviene repasar':'Necesitas reforzar los conocimientos';let rank=NAMES[Math.min(4,Math.floor(pct/20))];el.innerHTML=`<section class="panel"><span class="tag">RETO COMPLETADO · ${state.mode==='exam'?'SIMULACRO':'ENTRENAMIENTO'}</span><h1>Resultados de ${escapeHTML(state.name)}</h1><p class="muted">${msg}</p><div class="grid"><div class="tile"><div class="big">${hit*10}/${n*10}</div>Puntuación</div><div class="tile"><div class="big">${pct}%</div>Aciertos</div><div class="tile"><div class="big scoregood">${hit}</div>Correctas</div><div class="tile"><div class="big scorebad">${n-hit}</div>Incorrectas</div></div><h2>🏅 Nivel profesional: ${escapeHTML(rank)}</h2><h2>Resultados por apartado</h2><div class="grid">${Object.entries(s).map(([k,v])=>`<div class="tile"><strong>${escapeHTML(k)} · ${escapeHTML(SECTIONS[k])}</strong><p>${v.hit}/${v.n} aciertos</p></div>`).join('')}</div><h2>Contenidos que conviene repasar</h2><p>${weak.length?weak.map(([k])=>escapeHTML(k)+' · '+escapeHTML(SECTIONS[k])).join(' · '):'Has alcanzado al menos el 70 % en todos los apartados.'}</p><div class="row noprint"><button class="secondary" id="review">Revisar errores y soluciones</button><button class="secondary" id="print">Imprimir / Guardar PDF</button><button class="secondary" id="missed" ${hit===n?'disabled':''}>Repetir falladas</button><button class="primary" id="new">Volver a jugar</button></div><p class="foot">El progreso se guarda solo en este navegador, cuando lo permite.</p></section>`;document.querySelector('#review').onclick=review;document.querySelector('#print').onclick=()=>window.print();document.querySelector('#missed').onclick=missed;document.querySelector('#new').onclick=newGame;}
function review(){let items=indices().map((idx,i)=>({idx,i,q:QUESTIONS[idx],a:state.answers[i]}));state.screen='review';store();el.innerHTML=`<section class="panel"><span class="tag">CORRECCIÓN COMPLETA</span><h1>Revisión de ${escapeHTML(state.name)}</h1>${items.map(({q,a,i})=>`<div class="review"><span class="muted">Pregunta ${i+1} · ${escapeHTML(q.section)}</span><p><strong>${escapeHTML(q.q)}</strong></p><p>Tu respuesta: <span class="${a===q.answer?'scoregood':'scorebad'}">${escapeHTML(q.options[a])}</span></p><p>Correcta: <strong>${escapeHTML(q.options[q.answer])}</strong></p><p class="muted">${escapeHTML(q.why)}</p></div>`).join('')}<div class="row noprint"><button class="secondary" id="back">Volver a resultados</button><button class="secondary" id="print">Imprimir / Guardar PDF</button></div></section>`;document.querySelector('#back').onclick=results;document.querySelector('#print').onclick=()=>window.print()}
function missed(){let misses=indices().filter((idx,i)=>state.answers[i]!==QUESTIONS[idx].answer);if(!misses.length)return;state={name:state.name,mode:'training',index:0,answers:[],sound:state.sound,subset:misses,screen:'question'};store();render()}
function newGame(){state={name:state.name,mode:'training',index:0,answers:[],sound:state.sound,subset:null,screen:'welcome'};welcome()}
document.querySelector('#sound').onclick=()=>{state.sound=!state.sound;store();header()};if(state.screen==='results'||state.screen==='review')results();else render();
</script></body></html>
